name: Validate research site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-reproduce.txt
      - run: npm ci
      - run: python -m pip install -r requirements-reproduce.txt
      - run: npx quartz plugin install
      - name: Validate publication contract
        run: python scripts/publish_episode.py validate content
      - name: Check internal links
        run: python scripts/check_links.py content
      - name: Check bilingual llms.txt index
        run: python scripts/check_llms.py quartz/static/llms.txt content
      - name: Scan for secrets and private paths
        run: python scripts/privacy_scan.py .
      - name: Run bounded reproduction checks
        run: python scripts/reproduce.py --quick all
      - name: Build Quartz
        run: npx quartz build
      - name: Install llms.txt at the public root
        run: python scripts/install_llms.py quartz/static/llms.txt public/llms.txt
      - name: Check built routes and Mermaid
        run: python scripts/check_built_site.py public
