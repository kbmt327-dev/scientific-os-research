name: Deploy Open Research Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-reproduce.txt
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: python -m pip install -r requirements-reproduce.txt
      - run: npx quartz plugin install
      - run: python scripts/publish_episode.py validate content
      - run: python scripts/check_links.py content
      - run: python scripts/check_llms.py quartz/static/llms.txt content
      - run: python scripts/privacy_scan.py .
      - run: python scripts/reproduce.py --quick all
      - run: npx quartz build
      - run: python scripts/install_llms.py quartz/static/llms.txt public/llms.txt
      - run: python scripts/check_built_site.py public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
