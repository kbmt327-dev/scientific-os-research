<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.mono{font-family:Consolas,Menlo,monospace;font-size:12.5px}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Is 23 of 100,000 a fact about Gromark? Crib-compatible rate under arbitrary alphabets</text><line x1="400.0" y1="52" x2="400.0" y2="182" class="grid"/><text x="400.0" y="200" text-anchor="middle" class="small">0</text><line x1="512.0" y1="52" x2="512.0" y2="182" class="grid"/><text x="512.0" y="200" text-anchor="middle" class="small">1e-4</text><line x1="624.0" y1="52" x2="624.0" y2="182" class="grid"/><text x="624.0" y="200" text-anchor="middle" class="small">2e-4</text><line x1="736.0" y1="52" x2="736.0" y2="182" class="grid"/><text x="736.0" y="200" text-anchor="middle" class="small">3e-4</text><line x1="848.0" y1="52" x2="848.0" y2="182" class="grid"/><text x="848.0" y="200" text-anchor="middle" class="small">4e-4</text><line x1="960.0" y1="52" x2="960.0" y2="182" class="grid"/><text x="960.0" y="200" text-anchor="middle" class="small">5e-4</text><text x="390" y="79" text-anchor="end" class="small">Uniform random 97-digit masks (2,000,000)</text><rect x="400" y="62" width="455.28000000000003" height="24" fill="#1f6f5c"/><text x="861.28" y="79" class="small">4.07e-04</text><text x="390" y="119" text-anchor="end" class="small">Gromark, forward (100,000 primers)</text><rect x="400" y="102" width="436.79999999999995" height="24" fill="#9aa5b1"/><text x="842.8" y="119" class="small">3.90e-04</text><text x="390" y="159" text-anchor="end" class="small">Gromark, reversed (100,000 primers)</text><rect x="400" y="142" width="257.6" height="24" fill="#9aa5b1"/><text x="663.6" y="159" class="small">2.30e-04</text><text x="55" y="240" class="small">Letters forced by primer 57973 (reversed) under two paper-executable routes; lower case is the crib, dots are unforced:</text><text x="55" y="270" class="small">identity route, shift 0 (the claim): 13 forced</text><text x="55" y="288" class="mono">........E......A.E...eastnortheast....N......KST............B..berlinclock.E.AL.I....I...........</text><text x="55" y="314" class="small">column route 28, shift 50: 21 forced</text><text x="55" y="332" class="mono">......RR.AC..R.KLA..Teastnortheast......C....E.........N.O.SE..berlinclockI.K....I..T.K.....S....</text><text x="55" y="380" class="small">Across 55,096 (route, shift, direction) choices, 482 are compatible and the forced letters differ each time.</text><text x="55" y="400" class="small">All 40 randomly drawn primers also admit a compatible route.</text></svg>