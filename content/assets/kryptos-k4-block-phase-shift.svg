<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.badge{font-size:12px;fill:#fffdf8;font-weight:600}.big{font-size:22px;font-weight:600}</style><text x="540" y="30" text-anchor="middle" class="title">Block ciphers on K4 without W, with one phase shift in the grouping</text><text x="30" y="67" class="small">Four-square, free cipher squares (960)</text><rect x="340" y="52" width="140" height="22" rx="4" fill="#1f6f5c"/><text x="410" y="67" text-anchor="middle" class="badge">closed (logical)</text><text x="495" y="67" class="small">K4 0; 94.6% of shuffles also fail everywhere</text><text x="30" y="99" class="small">Two-square, free squares (576)</text><rect x="340" y="84" width="140" height="22" rx="4" fill="#1f6f5c"/><text x="410" y="99" text-anchor="middle" class="badge">closed (logical)</text><text x="495" y="99" class="small">K4 0; 78.5% of shuffles also fail everywhere</text><text x="30" y="131" class="small">Keyword squares (7.15 million, 22.8 bit)</text><rect x="340" y="116" width="140" height="22" rx="4" fill="#1f6f5c"/><text x="410" y="131" text-anchor="middle" class="badge">closed (logical)</text><text x="495" y="131" class="small">K4 0 hits; shuffles 0/100</text><text x="30" y="163" class="small">Bifid, one free square (2,765)</text><rect x="340" y="148" width="140" height="22" rx="4" fill="#6fa596"/><text x="410" y="163" text-anchor="middle" class="badge">closed, no power</text><text x="495" y="163" class="small">K4 0; every shuffle fails too: no power</text><text x="30" y="195" class="small">CM-Bifid, two free squares (2,765)</text><rect x="340" y="180" width="140" height="22" rx="4" fill="#c9a227"/><text x="410" y="195" text-anchor="middle" class="badge">undecidable</text><text x="495" y="195" class="small">K4 27 consistent; shuffle median 90 (post hoc)</text><text x="30" y="227" class="small">Fixed digraph chart C08 (97 / 92)</text><rect x="340" y="212" width="140" height="22" rx="4" fill="#c9a227"/><text x="410" y="227" text-anchor="middle" class="badge">undecidable</text><text x="495" y="227" class="small">K4 88 / 83 consistent, like shuffles</text><text x="30" y="290" class="small" font-weight="600">The 27 CM-Bifid settings under later plaintext constraints</text><rect x="60" y="306" width="290" height="112" rx="6" fill="none" stroke="#c9a227" stroke-width="2"/><text x="205" y="336" text-anchor="middle" class="big">27</text><text x="205" y="360" text-anchor="middle" class="small">consistent with the cribs</text><text x="205" y="382" text-anchor="middle" class="small" fill="#5d6d7e">shuffles: median 90</text><text x="205" y="398" text-anchor="middle" class="small" fill="#5d6d7e">P(count <= 27) = 0.12, post hoc</text><line x1="356" y1="354" x2="394" y2="354" stroke="#17202a" stroke-width="2"/><path d="M394,348 L400,354 L394,360 Z" fill="#17202a"/><rect x="400" y="306" width="290" height="112" rx="6" fill="none" stroke="#c9a227" stroke-width="2"/><text x="545" y="336" text-anchor="middle" class="big">6</text><text x="545" y="360" text-anchor="middle" class="small">remain with word fragments (10.95 bit)</text><text x="545" y="382" text-anchor="middle" class="small" fill="#5d6d7e">K4 survival 0.22, shuffles median 0.43</text><text x="545" y="398" text-anchor="middle" class="small" fill="#5d6d7e">2 of 20 shuffles at or below K4</text><line x1="696" y1="354" x2="734" y2="354" stroke="#17202a" stroke-width="2"/><path d="M734,348 L740,354 L734,360 Z" fill="#17202a"/><rect x="740" y="306" width="290" height="112" rx="6" fill="none" stroke="#c9a227" stroke-width="2"/><text x="885" y="336" text-anchor="middle" class="big">0</text><text x="885" y="360" text-anchor="middle" class="small">remain with candidate sets (20.34 bit)</text><text x="885" y="382" text-anchor="middle" class="small" fill="#5d6d7e">shuffles also lose every setting</text><text x="885" y="398" text-anchor="middle" class="small" fill="#5d6d7e">in 153 of 159</text><text x="30" y="450" class="small">Neither step separates K4 from shuffled ciphertexts significantly, so neither is evidence about K4.</text><text x="30" y="468" class="small">The last step is closed only if the candidate sets are assumed. Four free Four-square settings on the O-segment</text><text x="30" y="486" class="small">pairings stay untouched (4/4 remain with the fragments; the candidate sets cannot reach them).</text></svg>