<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Crib letters that any row of the list could explain (best convention), out of 24</text><line x1="330.0" y1="52" x2="330.0" y2="170" class="grid"/><text x="330.0" y="188" text-anchor="middle" class="small">0</text><line x1="485.0" y1="52" x2="485.0" y2="170" class="grid"/><text x="485.0" y="188" text-anchor="middle" class="small">6</text><line x1="640.0" y1="52" x2="640.0" y2="170" class="grid"/><text x="640.0" y="188" text-anchor="middle" class="small">12</text><line x1="795.0" y1="52" x2="795.0" y2="170" class="grid"/><text x="795.0" y="188" text-anchor="middle" class="small">18</text><line x1="950.0" y1="52" x2="950.0" y2="170" class="grid"/><text x="950.0" y="188" text-anchor="middle" class="small">24</text><text x="320" y="76" text-anchor="end" class="small">Hint keywords (40 rows)</text><rect x="330" y="58" width="465.0" height="26" fill="#1f6f5c"/><line x1="820.8" y1="55" x2="820.8" y2="87" stroke="#c9a227" stroke-width="3"/><text x="803.0" y="76" class="small" fill="#fffdf8"></text><text x="320" y="114" text-anchor="end" class="small">John 8:32 words (9 rows)</text><rect x="330" y="96" width="206.7" height="26" fill="#1f6f5c"/><line x1="562.5" y1="93" x2="562.5" y2="125" stroke="#c9a227" stroke-width="3"/><text x="544.7" y="114" class="small" fill="#fffdf8"></text><text x="320" y="152" text-anchor="end" class="small">World Clock places (146 rows)</text><rect x="330" y="134" width="516.7" height="26" fill="#1f6f5c"/><line x1="898.3" y1="131" x2="898.3" y2="163" stroke="#c9a227" stroke-width="3"/><text x="854.7" y="152" class="small" fill="#fffdf8"></text><line x1="950" y1="48" x2="950" y2="172" stroke="#b03a2e" stroke-width="2"/><text x="60" y="226" class="small">Green: K4. Yellow tick: median over 200 shuffled texts. A list below 24 (red line) cannot produce the crib</text><text x="60" y="248" class="small">under any rule for choosing its rows. The internal run found the same for all 44 lists with up to 64 rows,</text><text x="60" y="270" class="small">including the K1-K3 words and the K3 grids; sequential choosing reached at most 10/24 in 190 million settings.</text></svg>