<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="426" viewBox="0 0 1080 426"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">One arbitrary table per class fixed by the carved layout: K4 against 20,000 shuffles</text><line x1="430.0" y1="56" x2="430.0" y2="316" class="grid"/><text x="430.0" y="334" text-anchor="middle" class="small">0%</text><line x1="534.0" y1="56" x2="534.0" y2="316" class="grid"/><text x="534.0" y="334" text-anchor="middle" class="small">20%</text><line x1="638.0" y1="56" x2="638.0" y2="316" class="grid"/><text x="638.0" y="334" text-anchor="middle" class="small">40%</text><line x1="742.0" y1="56" x2="742.0" y2="316" class="grid"/><text x="742.0" y="334" text-anchor="middle" class="small">60%</text><line x1="846.0" y1="56" x2="846.0" y2="316" class="grid"/><text x="846.0" y="334" text-anchor="middle" class="small">80%</text><line x1="950.0" y1="56" x2="950.0" y2="316" class="grid"/><text x="950.0" y="334" text-anchor="middle" class="small">100%</text><text x="420" y="80" text-anchor="end" class="small">L1 row [109 pairs]</text><rect x="430" y="66" width="1.5" height="22" fill="#9aa5b1"/><text x="438.0" y="82" class="small">0.0%  <tspan fill="#b03a2e">K4 fails</tspan></text><text x="420" y="116" text-anchor="end" class="small">L2 column [2 pairs]</text><rect x="430" y="102" width="484.2" height="22" fill="#9aa5b1"/><text x="922.2" y="118" class="small">93.1%  <tspan fill="#1f6f5c">K4 fits</tspan></text><text x="420" y="152" text-anchor="end" class="small">G1 vertical fold (tableau cell behind) [1 pairs]</text><rect x="430" y="138" width="500.6" height="22" fill="#9aa5b1"/><text x="938.6" y="154" class="small">96.3%  <tspan fill="#1f6f5c">K4 fits</tspan></text><text x="420" y="188" text-anchor="end" class="small">G2 horizontal fold (cipher letter behind, round) [8 pairs]</text><rect x="430" y="174" width="387.0" height="22" fill="#9aa5b1"/><text x="825.0" y="190" class="small">74.4%  <tspan fill="#1f6f5c">K4 fits</tspan></text><text x="420" y="224" text-anchor="end" class="small">G2 horizontal fold (floor) [8 pairs]</text><rect x="430" y="210" width="386.3" height="22" fill="#9aa5b1"/><text x="824.3" y="226" class="small">74.3%  <tspan fill="#1f6f5c">K4 fits</tspan></text><text x="420" y="260" text-anchor="end" class="small">G2 horizontal fold (ceil) [7 pairs]</text><rect x="430" y="246" width="400.5" height="22" fill="#9aa5b1"/><text x="838.5" y="262" class="small">77.0%  <tspan fill="#1f6f5c">K4 fits</tspan></text><text x="420" y="296" text-anchor="end" class="small">G3 both folds (tableau cell behind) [3 pairs]</text><rect x="430" y="282" width="466.4" height="22" fill="#9aa5b1"/><text x="904.4" y="298" class="small">89.7%  <tspan fill="#1f6f5c">K4 fits</tspan></text><text x="60" y="366" class="small">Grey bar: share of shuffled ciphertexts consistent with the cribs. [n pairs]: crib pairs that share a class,</text><text x="60" y="386" class="small">the only places a table can be broken. The row table fails at the first crib (E->F and E->G in one row); the</text><text x="60" y="406" class="small">column and fold tables fit, but so do 74-96% of shuffles: consistent, and uninformative (capacity).</text></svg>