<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">How flat can English get? Share of simulations with an IC as low as K4's, by key bits per position</text><line x1="110" y1="320.0" x2="910" y2="320.0" class="grid"/><text x="102" y="324.0" text-anchor="end" class="small">0.00</text><line x1="110" y1="233.3" x2="910" y2="233.3" class="grid"/><text x="102" y="237.3" text-anchor="end" class="small">0.05</text><line x1="110" y1="146.7" x2="910" y2="146.7" class="grid"/><text x="102" y="150.7" text-anchor="end" class="small">0.10</text><line x1="110" y1="60.0" x2="910" y2="60.0" class="grid"/><text x="102" y="64.0" text-anchor="end" class="small">0.15</text><text x="110.0" y="340" text-anchor="middle" class="small">0</text><text x="270.0" y="340" text-anchor="middle" class="small">1</text><text x="430.0" y="340" text-anchor="middle" class="small">2</text><text x="590.0" y="340" text-anchor="middle" class="small">3</text><text x="750.0" y="340" text-anchor="middle" class="small">4</text><text x="910.0" y="340" text-anchor="middle" class="small">5</text><text x="510.0" y="362" text-anchor="middle" class="small">bits of key per position (log2 of the number of freely chosen rows)</text><path d="M270.0,320.0 L363.6,317.8 L430.0,305.7 L523.6,275.4 L590.0,240.7 L683.6,189.6 L750.0,145.4 L862.1,95.5" fill="none" stroke="#1f6f5c" stroke-width="2.5"/><circle cx="270.0" cy="320.0" r="4" fill="#1f6f5c"/><circle cx="363.6" cy="317.8" r="4" fill="#1f6f5c"/><circle cx="430.0" cy="305.7" r="4" fill="#1f6f5c"/><circle cx="523.6" cy="275.4" r="4" fill="#1f6f5c"/><circle cx="590.0" cy="240.7" r="4" fill="#1f6f5c"/><circle cx="683.6" cy="189.6" r="4" fill="#1f6f5c"/><circle cx="750.0" cy="145.4" r="4" fill="#1f6f5c"/><circle cx="862.1" cy="95.5" r="4" fill="#1f6f5c"/><line x1="567.6" y1="60" x2="567.6" y2="320" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/><text x="573.6" y="76" class="small" fill="#b03a2e">redundancy of English, 2.86 bits</text><text x="918" y="237.3" class="small">5%</text><text x="110" y="392" class="small">K4's flat letter counts become plausible (about 5%) only at about 3 bits per position, past what English redundancy can pin down.</text></svg>