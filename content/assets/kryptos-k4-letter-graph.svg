<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.node{font-size:15px;font-weight:600}</style><text x="540" y="28" text-anchor="middle" class="title">The 24 crib pairs as edges (plaintext letter to ciphertext letter): all 21 letters form one component</text><defs><marker id="a" viewBox="0 0 10 10" refX="17" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f5c"/></marker></defs><line x1="448.5" y1="131.5" x2="476.9" y2="180.6" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="300.0" y1="60.0" x2="382.4" y2="421.2" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="110.5" y1="235.8" x2="114.8" y2="292.3" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="123.1" y1="180.6" x2="151.5" y2="131.5" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="271.7" y1="437.9" x2="135.5" y2="345.0" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="217.6" y1="421.2" x2="135.5" y2="345.0" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="114.8" y1="292.3" x2="170.8" y2="389.3" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="123.1" y1="180.6" x2="114.8" y2="292.3" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="485.2" y1="292.3" x2="271.7" y2="437.9" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="448.5" y1="131.5" x2="489.5" y2="235.8" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="300.0" y1="60.0" x2="429.2" y2="389.3" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><circle cx="90.6" cy="234.3" r="12" fill="none" stroke="#b03a2e" stroke-width="2"/><line x1="123.1" y1="180.6" x2="110.5" y2="235.8" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="356.0" y1="68.4" x2="271.7" y2="437.9" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="448.5" y1="131.5" x2="193.0" y2="93.0" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="114.8" y1="292.3" x2="170.8" y2="389.3" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="382.4" y1="421.2" x2="151.5" y2="131.5" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="464.5" y1="345.0" x2="123.1" y2="180.6" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="271.7" y1="437.9" x2="123.1" y2="180.6" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="407.0" y1="93.0" x2="328.3" y2="437.9" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="382.4" y1="421.2" x2="244.0" y2="68.4" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="217.6" y1="421.2" x2="476.9" y2="180.6" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><line x1="407.0" y1="93.0" x2="170.8" y2="389.3" stroke="#1f6f5c" stroke-width="1.6" marker-end="url(#a)"/><circle cx="442.8" cy="403.9" r="12" fill="none" stroke="#b03a2e" stroke-width="2"/><circle cx="300.0" cy="60.0" r="13" fill="#fffdf8" stroke="#17202a"/><text x="300.0" y="65.0" text-anchor="middle" class="node">A</text><circle cx="356.0" cy="68.4" r="13" fill="#fffdf8" stroke="#17202a"/><text x="356.0" y="73.4" text-anchor="middle" class="node">B</text><circle cx="407.0" cy="93.0" r="13" fill="#fffdf8" stroke="#17202a"/><text x="407.0" y="98.0" text-anchor="middle" class="node">C</text><circle cx="448.5" cy="131.5" r="13" fill="#fffdf8" stroke="#17202a"/><text x="448.5" y="136.5" text-anchor="middle" class="node">E</text><circle cx="476.9" cy="180.6" r="13" fill="#fffdf8" stroke="#17202a"/><text x="476.9" y="185.6" text-anchor="middle" class="node">F</text><circle cx="489.5" cy="235.8" r="13" fill="#fffdf8" stroke="#17202a"/><text x="489.5" y="240.8" text-anchor="middle" class="node">G</text><circle cx="485.2" cy="292.3" r="13" fill="#fffdf8" stroke="#17202a"/><text x="485.2" y="297.3" text-anchor="middle" class="node">H</text><circle cx="464.5" cy="345.0" r="13" fill="#fffdf8" stroke="#17202a"/><text x="464.5" y="350.0" text-anchor="middle" class="node">I</text><circle cx="429.2" cy="389.3" r="13" fill="#fffdf8" stroke="#17202a"/><text x="429.2" y="394.3" text-anchor="middle" class="node">K</text><circle cx="382.4" cy="421.2" r="13" fill="#fffdf8" stroke="#17202a"/><text x="382.4" y="426.2" text-anchor="middle" class="node">L</text><circle cx="328.3" cy="437.9" r="13" fill="#fffdf8" stroke="#17202a"/><text x="328.3" y="442.9" text-anchor="middle" class="node">M</text><circle cx="271.7" cy="437.9" r="13" fill="#fffdf8" stroke="#17202a"/><text x="271.7" y="442.9" text-anchor="middle" class="node">N</text><circle cx="217.6" cy="421.2" r="13" fill="#fffdf8" stroke="#17202a"/><text x="217.6" y="426.2" text-anchor="middle" class="node">O</text><circle cx="170.8" cy="389.3" r="13" fill="#fffdf8" stroke="#17202a"/><text x="170.8" y="394.3" text-anchor="middle" class="node">P</text><circle cx="135.5" cy="345.0" r="13" fill="#fffdf8" stroke="#17202a"/><text x="135.5" y="350.0" text-anchor="middle" class="node">Q</text><circle cx="114.8" cy="292.3" r="13" fill="#fffdf8" stroke="#17202a"/><text x="114.8" y="297.3" text-anchor="middle" class="node">R</text><circle cx="110.5" cy="235.8" r="13" fill="#fffdf8" stroke="#17202a"/><text x="110.5" y="240.8" text-anchor="middle" class="node">S</text><circle cx="123.1" cy="180.6" r="13" fill="#fffdf8" stroke="#17202a"/><text x="123.1" y="185.6" text-anchor="middle" class="node">T</text><circle cx="151.5" cy="131.5" r="13" fill="#fffdf8" stroke="#17202a"/><text x="151.5" y="136.5" text-anchor="middle" class="node">V</text><circle cx="193.0" cy="93.0" r="13" fill="#fffdf8" stroke="#17202a"/><text x="193.0" y="98.0" text-anchor="middle" class="node">Y</text><circle cx="244.0" cy="68.4" r="13" fill="#fffdf8" stroke="#17202a"/><text x="244.0" y="73.4" text-anchor="middle" class="node">Z</text><text x="580" y="90" class="small">Red loops: S to S (position 32) and K to K (position 73).</text><text x="580" y="114" class="small"></text><text x="580" y="138" class="small">A cipher whose every per-position map keeps a fixed</text><text x="580" y="162" class="small">partition of the alphabet must put this whole component</text><text x="580" y="186" class="small">in one block. Blocks under 21 letters are therefore</text><text x="580" y="210" class="small">impossible without crib errors.</text><text x="580" y="234" class="small"></text><text x="580" y="258" class="small">Treating the most helpful crib pairs as errors, the</text><text x="580" y="282" class="small">largest component shrinks to 12 letters (1 error),</text><text x="580" y="306" class="small">9 (2 errors) and 7 (3 errors).</text><text x="580" y="330" class="small"></text><text x="580" y="354" class="small">Named partitions need many errors: vowels/consonants 7,</text><text x="580" y="378" class="small">A-Z halves 8, QWERTY rows 12, Morse-length classes 18,</text><text x="580" y="402" class="small">5x5 Polybius rows 19.</text></svg>