<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.badge{font-size:12px;fill:#fffdf8;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Machines with one phase break (1,300 positions and sizes, 10.3 bit)</text><text x="30" y="67" class="small">Free-wiring rotor R-a (31.2 bit)</text><rect x="360" y="52" width="130" height="22" rx="4" fill="#1f6f5c"/><text x="425" y="67" text-anchor="middle" class="badge">closed (logical)</text><text x="505" y="67" class="small">K4 0; shuffles 0/200; planted 100/100</text><text x="30" y="99" class="small">Free-wiring rotor R-b (36.8 bit)</text><rect x="360" y="84" width="130" height="22" rx="4" fill="#1f6f5c"/><text x="425" y="99" text-anchor="middle" class="badge">closed (logical)</text><text x="505" y="99" class="small">K4 0; shuffles 0/200; planted 100/100</text><text x="30" y="131" class="small">Enigma + free substitution (43.7 bit)</text><rect x="360" y="116" width="130" height="22" rx="4" fill="#1f6f5c"/><text x="425" y="131" text-anchor="middle" class="badge">closed (logical)</text><text x="505" y="131" class="small">K4 0; shuffles 0/10; planted 20/20</text><text x="30" y="163" class="small">Hagelin M-209 type (search 52.6 bit)</text><rect x="360" y="148" width="130" height="22" rx="4" fill="#c9a227"/><text x="425" y="163" text-anchor="middle" class="badge">undecidable</text><text x="505" y="163" class="small">no score >= 40.4; controls not run</text><text x="30" y="195" class="small">Chaocipher</text><rect x="360" y="180" width="130" height="22" rx="4" fill="#9aa5b1"/><text x="425" y="195" text-anchor="middle" class="badge">out of scope</text><text x="505" y="195" class="small">no step counter: a break is not defined</text><text x="30" y="236" class="small" font-weight="600">Hagelin type: best English score after hill-climbing every crib-consistent setting</text><line x1="360.0" y1="246" x2="360.0" y2="394" class="grid"/><text x="360.0" y="410" text-anchor="middle" class="small">0</text><line x1="493.3" y1="246" x2="493.3" y2="394" class="grid"/><text x="493.3" y="410" text-anchor="middle" class="small">10</text><line x1="626.7" y1="246" x2="626.7" y2="394" class="grid"/><text x="626.7" y="410" text-anchor="middle" class="small">20</text><line x1="760.0" y1="246" x2="760.0" y2="394" class="grid"/><text x="760.0" y="410" text-anchor="middle" class="small">30</text><line x1="893.3" y1="246" x2="893.3" y2="394" class="grid"/><text x="893.3" y="410" text-anchor="middle" class="small">40</text><text x="350" y="268" text-anchor="end" class="small">K4 (1,020,522,169 climbs)</text><rect x="360" y="254" width="515.2" height="22" fill="#b03a2e"/><text x="881.2" y="270" class="small">38.64</text><text x="350" y="304" text-anchor="end" class="small">shuffle 1 (1,912,894 climbs)</text><rect x="360" y="290" width="325.7" height="22" fill="#9aa5b1"/><text x="691.7" y="306" class="small">24.43</text><text x="350" y="340" text-anchor="end" class="small">shuffle 2 (1,891,980 climbs)</text><rect x="360" y="326" width="375.6" height="22" fill="#9aa5b1"/><text x="741.6" y="342" class="small">28.17</text><text x="350" y="376" text-anchor="end" class="small">shuffle 3 (2,157,995 climbs)</text><rect x="360" y="362" width="379.5" height="22" fill="#9aa5b1"/><text x="745.5" y="378" class="small">28.46</text><line x1="898.7" y1="242" x2="898.7" y2="394" stroke="#17202a" stroke-width="2" stroke-dasharray="5,4"/><text x="902.7" y="236" class="small">threshold 40.4</text><text x="30" y="436" class="small">The shuffles had about 500 times fewer climbs than K4, and the best score grows with the number of climbs,</text><text x="30" y="454" class="small">so the bars are not comparable. Planted controls were not run, so it is unknown whether a true key would</text><text x="30" y="472" class="small">reach 40.4. The Hagelin row is therefore undecidable, not a negative result.</text></svg>