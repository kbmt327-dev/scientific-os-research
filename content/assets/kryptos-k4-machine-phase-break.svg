<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.badge{font-size:12px;fill:#fffdf8;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Machines with one phase break (1,300 positions and sizes, 10.3 bit)</text><text x="30" y="67" class="small">Free-wiring rotor R-a (31.2 bit)</text><rect x="340" y="52" width="160" height="22" rx="4" fill="#1f6f5c"/><text x="420" y="67" text-anchor="middle" class="badge">closed (logical)</text><text x="515" y="67" class="small">K4 0; shuffles 0/200; planted 100/100</text><text x="30" y="99" class="small">Free-wiring rotor R-b (36.8 bit)</text><rect x="340" y="84" width="160" height="22" rx="4" fill="#1f6f5c"/><text x="420" y="99" text-anchor="middle" class="badge">closed (logical)</text><text x="515" y="99" class="small">K4 0; shuffles 0/200; planted 100/100</text><text x="30" y="131" class="small">Enigma + free substitution (43.7 bit)</text><rect x="340" y="116" width="160" height="22" rx="4" fill="#1f6f5c"/><text x="420" y="131" text-anchor="middle" class="badge">closed (logical)</text><text x="515" y="131" class="small">K4 0; shuffles 0/10; planted 20/20</text><text x="30" y="163" class="small">Hagelin M-209 type (search 52.6 bit)</text><rect x="340" y="148" width="160" height="22" rx="4" fill="#1f6f5c"/><text x="420" y="163" text-anchor="middle" class="badge">closed (controls 5/5)</text><text x="515" y="163" class="small">no score >= 40.4; controls under K4's crib stage 5/5 (2026-10-02)</text><text x="30" y="195" class="small">Chaocipher</text><rect x="340" y="180" width="160" height="22" rx="4" fill="#9aa5b1"/><text x="420" y="195" text-anchor="middle" class="badge">out of scope</text><text x="515" y="195" class="small">no step counter: a break is not defined</text><text x="30" y="224" class="small" font-weight="600">Hagelin type: best English score after hill-climbing every crib-consistent setting (K4, shuffles) and the true plaintext of each planted control</text><line x1="360.0" y1="256" x2="360.0" y2="530" class="grid"/><text x="360.0" y="546" text-anchor="middle" class="small">0</text><line x1="510.0" y1="256" x2="510.0" y2="530" class="grid"/><text x="510.0" y="546" text-anchor="middle" class="small">40</text><line x1="660.0" y1="256" x2="660.0" y2="530" class="grid"/><text x="660.0" y="546" text-anchor="middle" class="small">80</text><line x1="810.0" y1="256" x2="810.0" y2="530" class="grid"/><text x="810.0" y="546" text-anchor="middle" class="small">120</text><line x1="960.0" y1="256" x2="960.0" y2="530" class="grid"/><text x="960.0" y="546" text-anchor="middle" class="small">160</text><text x="350" y="277" text-anchor="end" class="small">K4 on engine v5 (1,020,522,169 climbs)</text><rect x="360" y="264" width="144.9" height="20" fill="#b03a2e"/><text x="519.5" y="279" class="small">38.64</text><text x="350" y="307" text-anchor="end" class="small">shuffle 1 (1,912,894 climbs)</text><rect x="360" y="294" width="91.6" height="20" fill="#9aa5b1"/><text x="457.6" y="309" class="small">24.43</text><text x="350" y="337" text-anchor="end" class="small">shuffle 2 (1,891,980 climbs)</text><rect x="360" y="324" width="105.6" height="20" fill="#9aa5b1"/><text x="471.6" y="339" class="small">28.17</text><text x="350" y="367" text-anchor="end" class="small">shuffle 3 (2,157,995 climbs)</text><rect x="360" y="354" width="106.7" height="20" fill="#9aa5b1"/><text x="472.7" y="369" class="small">28.46</text><text x="350" y="397" text-anchor="end" class="small">control 0 (1 K4-size run)</text><rect x="360" y="384" width="473.9" height="20" fill="#2f6db5"/><text x="839.9" y="399" class="small">126.36</text><text x="350" y="427" text-anchor="end" class="small">control 1 (1 K4-size run)</text><rect x="360" y="414" width="521.9" height="20" fill="#2f6db5"/><text x="887.9" y="429" class="small">139.16</text><text x="350" y="457" text-anchor="end" class="small">control 2 (1 K4-size run)</text><rect x="360" y="444" width="489.1" height="20" fill="#2f6db5"/><text x="855.1" y="459" class="small">130.44</text><text x="350" y="487" text-anchor="end" class="small">control 3 (1 K4-size run)</text><rect x="360" y="474" width="586.6" height="20" fill="#2f6db5"/><text x="952.6" y="489" class="small">156.44</text><text x="350" y="517" text-anchor="end" class="small">control 4 (1 K4-size run)</text><rect x="360" y="504" width="568.5" height="20" fill="#2f6db5"/><text x="934.5" y="519" class="small">151.59</text><line x1="511.5" y1="252" x2="511.5" y2="530" stroke="#17202a" stroke-width="2" stroke-dasharray="5,4"/><text x="515.5" y="248" class="small">threshold 40.4</text><text x="30" y="572" class="small">The shuffles had about 500 times fewer climbs than K4, and the best score grows with the number of climbs, so their bars</text><text x="30" y="590" class="small">are still not comparable with K4's. The five controls were planted under K4's own crib stage (2026-10-02), each searched with</text><text x="30" y="608" class="small">one K4-size run: every true plaintext is the global maximum (E_true 126.36 to 156.44, all above 40.4), while K4's best, 38.64, stays below</text><text x="30" y="626" class="small">the threshold. The Hagelin row is closed within the family; not rarer than random (no size-matched null).</text></svg>