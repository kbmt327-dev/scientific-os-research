ss="small">19 and 38 (red), and both come from one coincidence in the crib (R to P at 27 and 65, 38 apart).</text><text x="80" y="456" class="small">Elsewhere the test cannot decide: most shuffles fit too. A key linear in position fits nowhere, on either side.</text></svg>