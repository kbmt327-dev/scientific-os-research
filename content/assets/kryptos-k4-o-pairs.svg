<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Pairs (21+o, 59+o) as digraphs in 5x5 squares: K4 is inconsistent in all 56 settings</text><line x1="400.0" y1="54" x2="400.0" y2="220" class="grid"/><text x="400.0" y="238" text-anchor="middle" class="small">0%</text><line x1="512.0" y1="54" x2="512.0" y2="220" class="grid"/><text x="512.0" y="238" text-anchor="middle" class="small">20%</text><line x1="624.0" y1="54" x2="624.0" y2="220" class="grid"/><text x="624.0" y="238" text-anchor="middle" class="small">40%</text><line x1="736.0" y1="54" x2="736.0" y2="220" class="grid"/><text x="736.0" y="238" text-anchor="middle" class="small">60%</text><line x1="848.0" y1="54" x2="848.0" y2="220" class="grid"/><text x="848.0" y="238" text-anchor="middle" class="small">80%</text><line x1="960.0" y1="54" x2="960.0" y2="220" class="grid"/><text x="960.0" y="238" text-anchor="middle" class="small">100%</text><text x="390" y="72" text-anchor="end" class="small">FSstd (2 settings)</text><text x="390" y="88" text-anchor="end" class="small" fill="#b03a2e">K4: inconsistent</text><rect x="400" y="64" width="1.5" height="22" fill="#9aa5b1"/><text x="406.0" y="80" class="small">0.0%</text><text x="390" y="112" text-anchor="end" class="small">FSfree (2 settings)</text><text x="390" y="128" text-anchor="end" class="small" fill="#b03a2e">K4: inconsistent</text><rect x="400" y="104" width="207.8" height="22" fill="#9aa5b1"/><text x="613.8" y="120" class="small">37.1%</text><text x="390" y="152" text-anchor="end" class="small">TS (48 settings)</text><text x="390" y="168" text-anchor="end" class="small" fill="#b03a2e">K4: inconsistent</text><rect x="400" y="144" width="1.5" height="22" fill="#9aa5b1"/><text x="406.0" y="160" class="small">0.0%</text><text x="390" y="192" text-anchor="end" class="small">DK+/- (4 settings)</text><text x="390" y="208" text-anchor="end" class="small" fill="#b03a2e">K4: inconsistent</text><rect x="400" y="184" width="3.4" height="22" fill="#9aa5b1"/><text x="409.4" y="200" class="small">0.6%</text><text x="60" y="270" class="small">Grey bar: share of 1,000 shuffled ciphertexts (W positions kept) that are consistent with the cribs.</text><text x="60" y="290" class="small">Every setting rejects K4 by an exact proof, but shuffles mostly fail too, so this is a logical</text><text x="60" y="310" class="small">refutation, not evidence that K4 is further from these methods than random. Keyed squares: 0 of 1,238,220.</text></svg>