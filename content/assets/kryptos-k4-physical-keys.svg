<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">How rough is the key along the carved rows? Roughness S of 2,000 random crib keys, and K4</text><rect x="94.0" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="122.1" y="318" text-anchor="middle" class="small">0</text><rect x="158.3" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="186.4" y="318" text-anchor="middle" class="small">1</text><rect x="222.6" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="250.7" y="318" text-anchor="middle" class="small">2</text><rect x="286.9" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="315.0" y="318" text-anchor="middle" class="small">3</text><rect x="351.1" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="379.3" y="318" text-anchor="middle" class="small">4</text><rect x="415.4" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="443.6" y="318" text-anchor="middle" class="small">5</text><rect x="479.7" y="300.0" width="56.3" height="0.0" fill="#9aa5b1"/><text x="507.9" y="318" text-anchor="middle" class="small">6</text><rect x="544.0" y="299.0" width="56.3" height="1.0" fill="#9aa5b1"/><text x="572.1" y="318" text-anchor="middle" class="small">7</text><rect x="608.3" y="294.0" width="56.3" height="6.0" fill="#9aa5b1"/><text x="636.4" y="318" text-anchor="middle" class="small">8</text><rect x="672.6" y="237.4" width="56.3" height="62.6" fill="#9aa5b1"/><text x="700.7" y="318" text-anchor="middle" class="small">9</text><rect x="736.9" y="60.0" width="56.3" height="240.0" fill="#b03a2e"/><text x="765.0" y="318" text-anchor="middle" class="small">10</text><rect x="801.1" y="134.4" width="56.3" height="165.6" fill="#9aa5b1"/><text x="829.3" y="318" text-anchor="middle" class="small">11</text><rect x="865.4" y="295.9" width="56.3" height="4.1" fill="#9aa5b1"/><text x="893.6" y="318" text-anchor="middle" class="small">12</text><rect x="929.7" y="299.3" width="56.3" height="0.7" fill="#9aa5b1"/><text x="957.9" y="318" text-anchor="middle" class="small">13</text><rect x="90.0" y="50" width="321.4" height="8" fill="#1f6f5c"/><text x="90.0" y="44" class="small">smooth keys from the 3D model: S of 4 or less in 95% or more (sight lines, slow shadow clocks)</text><text x="540.0" y="340" text-anchor="middle" class="small">S (largest second difference along rows, or 2x2 cross difference, in key steps)</text><text x="90" y="372" class="small">K4 (red) has S = 10, the median of random keys. Keys read off a smooth physical map rarely exceed S = 4</text><text x="90" y="392" class="small">(S of 10 or more: 0 of 828 sight lines, at most 2.3% of slow shadow clocks), so K4's crib keys look nothing</text><text x="90" y="412" class="small">like them. Keys that depend only on horizontal position are ruled out outright: positions 32 and 63, and</text><text x="90" y="432" class="small">33 and 64, share a column but need different keys in every convention.</text></svg>