<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Rotor-machine families tested on K4: settings searched (log2) and settings that fit (all 0)</text><line x1="360.0" y1="50" x2="360.0" y2="226" class="grid"/><text x="360.0" y="244" text-anchor="middle" class="small">0</text><line x1="466.7" y1="50" x2="466.7" y2="226" class="grid"/><text x="466.7" y="244" text-anchor="middle" class="small">20</text><line x1="573.3" y1="50" x2="573.3" y2="226" class="grid"/><text x="573.3" y="244" text-anchor="middle" class="small">40</text><line x1="680.0" y1="50" x2="680.0" y2="226" class="grid"/><text x="680.0" y="244" text-anchor="middle" class="small">60</text><line x1="786.7" y1="50" x2="786.7" y2="226" class="grid"/><text x="786.7" y="244" text-anchor="middle" class="small">80</text><line x1="893.3" y1="50" x2="893.3" y2="226" class="grid"/><text x="893.3" y="244" text-anchor="middle" class="small">100</text><line x1="1000.0" y1="50" x2="1000.0" y2="226" class="grid"/><text x="1000.0" y="244" text-anchor="middle" class="small">120</text><text x="350" y="73" text-anchor="end" class="small">single rotor, free wiring (EP-0083)</text><rect x="360" y="58" width="30.4" height="22" fill="#1f6f5c"/><text x="396.4" y="74" class="small">5.7 bits, 0 fit</text><text x="350" y="107" text-anchor="end" class="small">R-a entry/exit alphabets</text><rect x="360" y="92" width="111.5" height="22" fill="#1f6f5c"/><text x="477.5" y="108" class="small">20.9 bits, 0 fit</text><text x="350" y="141" text-anchor="end" class="small">R-b position keys</text><rect x="360" y="126" width="140.8" height="22" fill="#1f6f5c"/><text x="506.8" y="142" class="small">26.4 bits, 0 fit</text><text x="350" y="175" text-anchor="end" class="small">R-c odometer, free slow rotor</text><rect x="360" y="160" width="193.1" height="22" fill="#1f6f5c"/><text x="559.1" y="176" class="small">36.2 bits, 0 fit</text><text x="350" y="209" text-anchor="end" class="small">reflector machine + free substitution</text><rect x="360" y="194" width="178.1" height="22" fill="#1f6f5c"/><text x="544.1" y="210" class="small">33.4 bits, 0 fit</text><line x1="961.7" y1="46" x2="961.7" y2="226" stroke="#b03a2e" stroke-width="2"/><text x="955.7" y="264" text-anchor="end" class="small" fill="#b03a2e">crib: 112.8 bits</text><text x="30" y="314" class="small">The free wiring or free substitution in each family is solved exactly, not searched: it adds about 88 bits that the counts above do not include.</text></svg>