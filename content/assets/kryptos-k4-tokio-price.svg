<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">What the TOKIO reading is worth as each freedom is paid (exact null, log scale)</text><line x1="430.0" y1="60" x2="430.0" y2="200" class="grid"/><text x="430.0" y="218" text-anchor="middle" class="small">1e-7</text><line x1="544.0" y1="60" x2="544.0" y2="200" class="grid"/><text x="544.0" y="218" text-anchor="middle" class="small">1e-6</text><line x1="658.0" y1="60" x2="658.0" y2="200" class="grid"/><text x="658.0" y="218" text-anchor="middle" class="small">1e-5</text><line x1="772.0" y1="60" x2="772.0" y2="200" class="grid"/><text x="772.0" y="218" text-anchor="middle" class="small">1e-4</text><line x1="886.0" y1="60" x2="886.0" y2="200" class="grid"/><text x="886.0" y="218" text-anchor="middle" class="small">1e-3</text><line x1="1000.0" y1="60" x2="1000.0" y2="200" class="grid"/><text x="1000.0" y="218" text-anchor="middle" class="small">1e-2</text><text x="420" y="89" text-anchor="end" class="small">One named target, 5-letter readings only (EP-0010 per target)</text><rect x="430" y="72" width="119.16681958167896" height="24" fill="#9aa5b1"/><text x="555.166819581679" y="89" class="small">1.11e-06</text><text x="420" y="131" text-anchor="end" class="small">All 17 five-letter place names</text><rect x="430" y="114" width="253.80299793665392" height="24" fill="#9aa5b1"/><text x="689.8029979366539" y="131" class="small">1.68e-05</text><text x="420" y="173" text-anchor="end" class="small">All place names of any reachable length</text><rect x="430" y="156" width="475.4254849887317" height="24" fill="#1f6f5c"/><text x="911.4254849887317" y="173" class="small">1.48e-03</text><text x="55" y="258" class="small">Where the 1.48e-3 comes from, by length of the accepted place name:</text><rect x="55" y="270" width="658.7902196177927" height="30" fill="#1f6f5c"/><rect x="713.7902196177927" y="270" width="275.05454395603226" height="30" fill="#6fa596"/><rect x="988.8447635738249" y="270" width="10.747346022337666" height="30" fill="#c9a227"/><rect x="999.5921095961626" y="270" width="0.8" height="30" fill="#9aa5b1"/><rect x="55" y="316" width="14" height="14" fill="#1f6f5c"/><text x="75" y="328" class="small">3 letters (ROM only): 69.7%</text><rect x="280" y="316" width="14" height="14" fill="#6fa596"/><text x="300" y="328" class="small">4 letters (12 names): 29.1%</text><rect x="505" y="316" width="14" height="14" fill="#c9a227"/><text x="525" y="328" class="small">5 letters (17 names, incl. TOKIO): 1.1%</text><rect x="850" y="316" width="14" height="14" fill="#9aa5b1"/><text x="870" y="328" class="small">6+ letters: 0.04%</text><text x="55" y="365" class="small">Short names are cheap to hit by chance, so accepting them costs most of the price. The target list itself was chosen after the cribs pointed to it; that choice is not paid.</text></svg>