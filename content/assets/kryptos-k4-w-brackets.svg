120" width="9" height="34" fill="#e6e1d6"/><rect x="925" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="935" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="945" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="955" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="965" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="975" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="985" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="995" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="1005" y="120" width="9" height="34" fill="#e6e1d6"/><rect x="1015" y="120" width="9" height="34" fill="#e6e1d6"/><text x="259.5" y="112" text-anchor="middle" class="tiny">20</text><text x="419.5" y="112" text-anchor="middle" class="tiny">36</text><text x="539.5" y="112" text-anchor="middle" class="tiny">48</text><text x="639.5" y="112" text-anchor="middle" class="tiny">58</text><text x="799.5" y="112" text-anchor="middle" class="tiny">74</text><path d="M55 164 L55 172 L254 172 L254 164" fill="none" stroke="#5b6570" stroke-width="1.2"/><text x="154.5" y="192" text-anchor="middle" class="seg">20 → T</text><path d="M265 164 L265 172 L414 172 L414 164" fill="none" stroke="#5b6570" stroke-width="1.2"/><text x="339.5" y="192" text-anchor="middle" class="seg">15 → O</text><path d="M425 164 L425 172 L534 172 L534 164" fill="none" stroke="#5b6570" stroke-width="1.2"/><text x="479.5" y="192" text-anchor="middle" class="seg">11 → K</text><path d="M545 164 L545 172 L634 172 L634 164" fill="none" stroke="#5b6570" stroke-width="1.2"/><text x="589.5" y="192" text-anchor="middle" class="seg">9 → I</text><path d="M645 164 L645 172 L794 172 L794 164" fill="none" stroke="#5b6570" stroke-width="1.2"/><text x="719.5" y="192" text-anchor="middle" class="seg">15 → O</text><path d="M805 164 L805 172 L1024 172 L1024 164" fill="none" stroke="#5b6570" stroke-width="1.2"/><text x="914.5" y="192" text-anchor="middle" class="seg">22 → V</text><text x="55" y="230" class="small">Gap lengths 20, 15, 11, 9, 15, 22 read as letters (A=1) give T O K I O V. Both cribs lie in the two 15-letter "O" gaps:</text><text x="55" y="250" class="small">W at 20 touches the start of EASTNORTHEAST, W at 74 touches the end of BERLINCLOCK. Each crib is bracketed on one side only.</text><text x="55" y="280" class="small">Chance that cells 20 and 74 are both W: 0.0021. Chance that they hold the same letter, any letter: 0.036.</text><text x="55" y="300" class="small">If the TOKIO reading is right, it already fixes every W position, so this adds no independent evidence for it.</text></svg>