<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Expected chance passes for each test, and what K4 gave</text><line x1="350.0" y1="62" x2="350.0" y2="350" class="grid"/><text x="350.0" y="368" text-anchor="middle" class="small">1e-32</text><line x1="408.4" y1="62" x2="408.4" y2="350" class="grid"/><text x="408.4" y="368" text-anchor="middle" class="small">1e-28</text><line x1="466.8" y1="62" x2="466.8" y2="350" class="grid"/><text x="466.8" y="368" text-anchor="middle" class="small">1e-24</text><line x1="525.1" y1="62" x2="525.1" y2="350" class="grid"/><text x="525.1" y="368" text-anchor="middle" class="small">1e-20</text><line x1="583.5" y1="62" x2="583.5" y2="350" class="grid"/><text x="583.5" y="368" text-anchor="middle" class="small">1e-16</text><line x1="641.9" y1="62" x2="641.9" y2="350" class="grid"/><text x="641.9" y="368" text-anchor="middle" class="small">1e-12</text><line x1="700.3" y1="62" x2="700.3" y2="350" class="grid"/><text x="700.3" y="368" text-anchor="middle" class="small">1e-8</text><line x1="758.6" y1="62" x2="758.6" y2="350" class="grid"/><text x="758.6" y="368" text-anchor="middle" class="small">1e-4</text><line x1="817.0" y1="62" x2="817.0" y2="350" class="grid"/><text x="817.0" y="368" text-anchor="middle" class="small">1e0</text><line x1="875.4" y1="62" x2="875.4" y2="350" class="grid"/><text x="875.4" y="368" text-anchor="middle" class="small">1e4</text><line x1="817.0" y1="62" x2="817.0" y2="350" stroke="#7d8a96" stroke-dasharray="4,3"/><text x="817.0" y="56" text-anchor="middle" class="small">1 expected pass</text><text x="338" y="94.0" text-anchor="end" class="small">W skipped: procedure enumerator, up to 2 errors</text><line x1="350" y1="90.0" x2="633.5" y2="90.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="633.5" cy="90.0" r="6" fill="#2e5c8a"/><text x="904" y="94.0" class="small" fill="#2e5c8a">K4 0: closed</text><text x="338" y="134.0" text-anchor="end" class="small">W skipped: text key, shift table</text><line x1="350" y1="130.0" x2="435.1" y2="130.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="435.1" cy="130.0" r="6" fill="#2e5c8a"/><text x="904" y="134.0" class="small" fill="#2e5c8a">K4 0: closed</text><text x="338" y="174.0" text-anchor="end" class="small">W skipped: text key + mask on plaintext</text><line x1="350" y1="170.0" x2="680.5" y2="170.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="680.5" cy="170.0" r="6" fill="#2e5c8a"/><text x="904" y="174.0" class="small" fill="#2e5c8a">K4 0: closed</text><text x="338" y="214.0" text-anchor="end" class="small">W skipped: text key + mask on ciphertext</text><line x1="350" y1="210.0" x2="696.7" y2="210.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="696.7" cy="210.0" r="6" fill="#2e5c8a"/><text x="904" y="214.0" class="small" fill="#2e5c8a">K4 0: closed</text><text x="338" y="254.0" text-anchor="end" class="small">W skipped: text key + masks on both sides</text><line x1="350" y1="250.0" x2="871.5" y2="250.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="871.5" cy="250.0" r="6" fill="#b03a2e"/><text x="904" y="254.0" class="small" fill="#b03a2e">K4 5,970: undecidable</text><text x="338" y="294.0" text-anchor="end" class="small">Morse mask + free substitution</text><line x1="350" y1="290.0" x2="670.3" y2="290.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="670.3" cy="290.0" r="6" fill="#2e5c8a"/><text x="904" y="294.0" class="small" fill="#2e5c8a">K4 0: closed</text><text x="338" y="334.0" text-anchor="end" class="small">Digit-wise addition, 22 fixed strings</text><line x1="350" y1="330.0" x2="380.6" y2="330.0" stroke="#c9d1d9" stroke-width="2"/><circle cx="380.6" cy="330.0" r="6" fill="#2e5c8a"/><text x="904" y="334.0" class="small" fill="#2e5c8a">K4 0: closed</text><text x="60" y="400" class="small">Dot: expected number of settings that pass the crib by chance (closed form; for the two-sided mask, the</text><text x="60" y="420" class="small">ciphertext's own random-key pass rate). Every test far left of 1 gave K4 0, as did its shuffles, so those</text><text x="60" y="440" class="small">are logical refutations, not evidence that K4 is rarer than random. The two-sided mask passes about as many</text><text x="60" y="460" class="small">settings as chance; its English stage was not run. The pure Morse mask needs no search (excluded by logic).</text></svg>