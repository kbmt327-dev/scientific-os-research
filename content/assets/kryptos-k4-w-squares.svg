<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.badge{font-size:12px;fill:#fffdf8;font-weight:600}</style><text x="540" y="30" text-anchor="middle" class="title">K4 with the Ws removed (92 letters, 25 types), enciphered with 5x5 squares</text><text x="30" y="77" class="small">Keyword squares: Four-square, Two-square, Bifid (925,600)</text><rect x="560" y="62" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="77" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="77" class="small">0 settings fit; shuffles 0</text><text x="30" y="111" class="small">Four-square, two free cipher squares</text><rect x="560" y="96" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="111" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="111" class="small">inconsistent in every pairing; shuffles 0/2,000</text><text x="30" y="145" class="small">Two-square, free squares (72 settings)</text><rect x="560" y="130" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="145" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="145" class="small">one crib digraph kills each convention</text><text x="30" y="179" class="small">Bifid, one free square</text><rect x="560" y="164" width="150" height="22" rx="4" fill="#6fa596"/><text x="635" y="179" text-anchor="middle" class="badge">closed (with power)</text><text x="725" y="179" class="small">finds 96-100% of plants; K4 at shuffle level</text><text x="30" y="213" class="small">CM-Bifid, two free squares (79 block settings)</text><rect x="560" y="198" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="213" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="213" class="small">inconsistent; 14% of shuffles also fail</text><text x="30" y="247" class="small">Playfair, then a shift mask</text><rect x="560" y="232" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="247" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="247" class="small">0 settings; chance ≤ 6.6e-10</text><text x="30" y="281" class="small">Shift mask, then Playfair</text><rect x="560" y="266" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="281" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="281" class="small">doubled ciphertext pairs (5 / 2 / 3)</text><text x="30" y="315" class="small">Keyword squares with a shift mask before or after</text><rect x="560" y="300" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="315" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="315" class="small">0; expected false hits 0.00015</text><text x="30" y="349" class="small">2-D shifts, rotations, mirrors on a free 5x5 grid</text><rect x="560" y="334" width="150" height="22" rx="4" fill="#1f6f5c"/><text x="635" y="349" text-anchor="middle" class="badge">closed (logical)</text><text x="725" y="349" class="small">where decidable; long periods open</text><text x="30" y="383" class="small">Two free squares with long periods, free per-position symmetries</text><rect x="560" y="368" width="150" height="22" rx="4" fill="#c9a227"/><text x="635" y="383" text-anchor="middle" class="badge">not decidable</text><text x="725" y="383" class="small">not decidable from the cribs</text><text x="30" y="444" class="small">"Logical" means no setting reproduces the cribs; random ciphertext usually fails the same way, so K4 is not shown to be rarer than random.</text></svg>