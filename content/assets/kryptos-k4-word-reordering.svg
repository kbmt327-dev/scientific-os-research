<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="302" viewBox="0 0 1080 302"><rect width="100%" height="100%" fill="#fffdf8"/><style>text{font-family:Arial,sans-serif;fill:#17202a}.small{font-size:13px}.title{font-size:17px;font-weight:600}.grid{stroke:#d9dde2;stroke-width:1}</style><text x="540" y="30" text-anchor="middle" class="title">Letters reordered inside each word, then substituted: size of each test (log2)</text><line x1="330.0" y1="48" x2="330.0" y2="202" class="grid"/><text x="330.0" y="220" text-anchor="middle" class="small">0</text><line x1="440.0" y1="48" x2="440.0" y2="202" class="grid"/><text x="440.0" y="220" text-anchor="middle" class="small">20</text><line x1="550.0" y1="48" x2="550.0" y2="202" class="grid"/><text x="550.0" y="220" text-anchor="middle" class="small">40</text><line x1="660.0" y1="48" x2="660.0" y2="202" class="grid"/><text x="660.0" y="220" text-anchor="middle" class="small">60</text><line x1="770.0" y1="48" x2="770.0" y2="202" class="grid"/><text x="770.0" y="220" text-anchor="middle" class="small">80</text><line x1="880.0" y1="48" x2="880.0" y2="202" class="grid"/><text x="880.0" y="220" text-anchor="middle" class="small">100</text><line x1="990.0" y1="48" x2="990.0" y2="202" class="grid"/><text x="990.0" y="220" text-anchor="middle" class="small">120</text><text x="320" y="68" text-anchor="end" class="small">Procedures alone (EP-0119)</text><rect x="330" y="52" width="286.34" height="20" fill="#9aa5b1"/><text x="622.3" y="67" class="small">52.1</text><text x="320" y="98" text-anchor="end" class="small">+ 8 fixed rules (21 crib assignments)</text><rect x="330" y="82" width="310.50" height="20" fill="#1f6f5c"/><text x="646.5" y="97" class="small">56.5</text><text x="320" y="128" text-anchor="end" class="small">+ any order inside words, S2 (NORTH split)</text><rect x="330" y="112" width="459.45" height="20" fill="#1f6f5c"/><text x="795.5" y="127" class="small">83.5</text><text x="320" y="158" text-anchor="end" class="small">+ any order inside words, S1 (hint spans)</text><rect x="330" y="142" width="492.33" height="20" fill="#1f6f5c"/><text x="828.3" y="157" class="small">89.5</text><text x="320" y="188" text-anchor="end" class="small">+ any order inside words, S3 (crib = word)</text><rect x="330" y="172" width="562.45" height="20" fill="#1f6f5c"/><text x="898.4" y="187" class="small">102.3</text><line x1="950.5" y1="44" x2="950.5" y2="202" stroke="#b03a2e" stroke-width="2"/><text x="944.5" y="238" text-anchor="end" class="small" fill="#b03a2e">crib: 24 letters = 112.8 bits</text><text x="55" y="262" class="small">Every test stays below the crib, so a true procedure would stand out. K4 gave 0 in all of them, in both orders (reorder then substitute, and the reverse);</text><text x="55" y="282" class="small">two shuffled ciphertexts gave 0 as well; planted controls 76/76 were found.</text></svg>