schema_version: open-research-lab.program-current.v1
site_url: https://kbmt327-dev.github.io/scientific-os-research
programs:
  - id: gpu-scheduling
    research_id_prefix: GPU-SCHED-
    current_research_id: GPU-SCHED-EP-0030
    ja:
      title: GPUクラスタのスケジューリング
      home_summary: nodeの断片化がサイズ優先とFCFS・backfillの順位を入れ替えるかを、封印した予測で試しました。
      question: サイズ優先の条件と容量境界を、どの情報・観測窓なら確かめられるか。
      claim: EP-0030の封印予測は3/6で、決定予測P2はFAIL。912 runの合成検定では、trace_likeの順位は採点可能な3/3行で保った一方、gang_oddでは4/4行でsrptとsf_srptが逆転しました。EP-0029の事後順位をmix一般へ広げる主張は撤回します。近似的な負荷対照P5は計算可能な4/8行でPASSし、保存gradingからの再計算では差の約64〜100%が負荷余裕と整合します。これは因果分解ではありません。152
        cell中8はUNKNOWN。実クラスタと新規性はUNKNOWN。
      evidence_boundary: 合成MSJ model1つ、64 GPU・8 GPU/node、指数サービス、sticky配置・migrationなし。封印はlocal commitのみ。公開検算は保存gradingの投影と算術で、912
        runの再実行でも独立追試でもありません。
    en:
      title: GPU cluster scheduling
      home_summary: We test, with sealed predictions, whether node fragmentation reorders size-first policies
        against FCFS and backfill.
      question: Under which information and observation windows can size-first conditions and capacity boundaries
        be established?
      claim: EP-0030 met 3/6 sealed predictions and failed the decision prediction P2. In 912 synthetic
        runs, the order held in 3/3 scorable trace_like rows but srpt and sf_srpt reversed in 4/4 gang_odd
        rows. The EP-0029 post hoc order is withdrawn as a general claim across mixes. Approximate load
        controls P5 passed in 4/8 computable rows; saved-grading arithmetic makes roughly 64–100% of the
        gap consistent with load headroom. This is not a causal decomposition. Eight of 152 cells are UNKNOWN.
        Real clusters and novelty remain UNKNOWN.
      evidence_boundary: One synthetic MSJ model, 64 GPUs in 8-GPU nodes, exponential service, sticky placement
        and no migration. Local-commit seals only. Public checks verify a projection of saved grading and
        arithmetic, not a rerun of 912 simulations or independent replication.
  - id: queueing-system-identification
    research_id_prefix: SIM-WORLD-
    current_research_id: SIM-WORLD-EP-0001
    ja:
      title: 待ち行列のシステム同定
      home_summary: 外から観測できる記録だけで、内部の待ち行列機構をどこまで特定できるかを検査しています。
      question: 中身を隠した待ち行列の世界に対し、外から見える記録だけでどこまで仕組みを言い当てられるか。
      claim: あらかじめ開示された候補集合の中で、隠された1事例を正しく同定でき、5つの構造要素すべてが保留した正解と一致しました。
      evidence_boundary: これは与えられた選択肢から選ぶ検査であり、未知の仮説空間からの発見でも、実システムへの適用検証でもありません。
    en:
      title: Queueing system identification
      home_summary: We test how much of a hidden queueing mechanism can be recovered from externally visible records alone.
      question: Given a queueing world whose mechanism is hidden, how much of it can external records alone recover?
      claim: Within a disclosed family of candidate mechanisms, one hidden instance was identified correctly and all five structural components matched the withheld truth.
      evidence_boundary: This tests selection from given options, not discovery from an open hypothesis space, and transfer to a real system has not been tested.

  - id: human-model-interface
    research_id_prefix: HUMAN-MODEL-
    current_research_id: HUMAN-MODEL-EP-0005
    ja:
      title: 人体運動モデルのデータ接続
      home_summary: 計測データをmodelへ渡す前に、座標の取り違え、答えの漏れ、見かけだけの外部検証を止める方法を研究しています。
      question: 計測した人体の動きをmodelへ渡す前に、座標の取り違え、答えの漏れ、見かけだけの外部検証を止められるか。
      claim: 接続契約は意図的に壊した7つの変種を拒否します。dataset gateはCarterをdevelopment 30人、validation 10人、test 10人に分け、OpenCapの実験室dataを外部検証、Knee Grand Challengeを内部荷重のstress testに限定しました。B3Dはsource adapter形式で、内部表現はNumPy配列と明示的な意味情報です。Nimbleは必須ではありません。
      evidence_boundary: model fittingもholdout読込もまだ実施していません。
    en:
      title: Human movement model interfaces
      home_summary: We study how to stop coordinate mix-ups, target leakage, and false external validation before measured motion reaches a model.
      question: Before measured human motion reaches a model, can explicit contracts and dataset boundaries stop coordinate mix-ups, target leakage, and false external validation?
      claim: The interface contract rejects seven deliberately broken variants. The dataset gate splits Carter into 30 development, 10 validation, and 10 test participants; reserves OpenCap laboratory data for external validation; and reserves Knee Grand Challenge for internal-load stress testing. B3D is a source-adapter format, the internal representation is NumPy plus explicit semantics, and Nimble is not mandatory.
      evidence_boundary: No model has been fitted and no holdout has been read.

  - id: badminton-biomechanics
    research_id_prefix: IAA-
    current_research_id: IAA-EP-0008
    ja:
      title: バドミントンのバイオメカニクス
      home_summary: スマッシュの準備時間と身体重心が動作に与える影響を、切り分けて測る実験を設計しています。
      question: スマッシュで、準備時間の短さと後方重心の効果を切り分けられるか。
      claim: 公開済みなのは実験計画と検出力の感度解析までで、観測はまだありません。交互作用の検出には主効果より多い参加者が必要と分かり、人数を決められていません。
      evidence_boundary: 機器の実行可能性と倫理審査が未解決なので、計画は封印されておらず、データ取得も承認されていません。
    en:
      title: Badminton biomechanics
      home_summary: We are designing an experiment that separates the effects of preparation time and centre of mass on the badminton smash.
      question: In the smash, can the effect of short preparation time be separated from the effect of backward centre of mass?
      claim: Only the experimental design and power sensitivity are public; no observations exist. Detecting the interaction requires substantially more participants than detecting the main effects, so the sample size remains undecided.
      evidence_boundary: Instrument feasibility and ethics remain unresolved, so the protocol is not sealed and data collection is not authorized.

  - id: intervention-instrument
    research_id_prefix: INTERVENTION-
    current_research_id: INTERVENTION-EP-0001
    ja:
      title: 介入する領域の研究装置
      home_summary: 予測した人が自分で手を打つ領域で、封印して採点する装置が何を測れるのかを調べています。
      question: 予測者が行為者でもある領域で、封印して採点する装置は何を測れるのか。観測用の契約はどこで破れるのか。
      claim: |-
        観測用の予測契約は5か所で破れます。外れたのがモデルか実行かを分けられない、予測者が自分の予測を外しにいける、採点日を自分で選べない、待つことが停滞になる、成功が測っている分布を動かす、の5つです。

        破れごとに**記録を拒否する不変条件**を1つ対応させました。採点は4点結合（閾値・意思決定・実行・結果）を通してのみ行え、意思決定が開かれなかった予測は支持にも反証にもできません。自己干渉は封印時のスタンス宣言で決着させ、介入込みの成功として数える案は採りませんでした——良いモデルと良い実行者を台帳が区別できなくなるためです。
      evidence_boundary: 契約の検証のみで、この文法で封印された予測はまだ1本も採点日を迎えていません。5つが破れの全部である保証もありません。
    en:
      title: The instrument in domains that require acting
      home_summary: What a seal-and-score apparatus can measure when the predictor is also the one who acts.
      question: What can a seal-and-score apparatus measure when the predictor is also the actor, and where does the observational contract break?
      claim: |-
        The observational prediction contract breaks in five places: a miss cannot be split into a wrong model and nobody acting, the predictor can go and make its own prediction false, the scoring date is not theirs to choose, waiting becomes a stall, and success moves the distribution being measured.

        Each breach is answered by **an invariant that refuses the record**. Scoring runs only through a four-point joint — threshold, decision, execution, result — and a prediction whose decision never opened can be neither supported nor refuted. Self-interference is settled by a stance declared at seal time; counting an intervention as its own success was declined, because it would stop the ledger separating a good model from a good operator.
      evidence_boundary: Contract validation only. No prediction sealed in this grammar has reached a scoring date, and there is no guarantee that five is the complete set of breaches.

  - id: measurement-design
    research_id_prefix: FRONTIER-METRICS-
    current_research_id: FRONTIER-METRICS-REVIEW-0001
    ja:
      title: 測定設計が見るもの、見ないもの
      home_summary: 自分で作った世界から出た測定設計上の結論を、どう疑えば落とせるのかを調べています。
      question: 自分で作った世界から出た測定設計上の結論は、どこを掃引すれば落ちるのか。
      claim: |-
        **現在、看板に掲げていた結論は2本とも取り下げています。** 合成世界は作者に媚び、媚び方には型があると分かったからです。

        1本目は、測っている量の唯一の駆動源を自分で定数に固定していた形。その定数は指標を0.209動かし、測りたかった量は最大でも0.027しか動かさず符号も安定しませんでした——**7.9倍**です。2本目は、観測できない邪魔者を一点に固定し、判定線を標本数だけの関数として公開した形。邪魔者を掃引すると、完全に閉じた世界が公開した判定線を超えます。

        生き残ったのは弱い形だけです。**再利用と沈殿の速さは別の量で、前者だけが反応する。** これは定数由来ではありません。
      evidence_boundary: 合成であり機構の族はこちらが書いたものです。実データは一行も使っておらず、応用分野についての主張は含みません。自己レビューなので、思いつかなかった攻撃は原理的に入っていません。
    en:
      title: What a measurement design sees, and what it does not
      home_summary: How to doubt a measurement-design result that came out of a world you built yourself.
      question: Where does a measurement-design result obtained on a world of your own making give way under a sweep?
      claim: |-
        **Both headline results are currently withdrawn.** A synthetic world flatters its author, and the flattery turned out to have forms.

        The first was fixing the only thing that drives the quantity being measured. That constant moves the metric by 0.209; the thing we claimed to measure moves it by at most 0.027, with an unstable sign — **a factor of 7.9**. The second was pinning an unobservable nuisance at one value and publishing a decision line as a function of sample size. Sweep the nuisance and a frontier that fully closes clears the published line.

        Only the weaker form survives: **reuse and the settling rate are different quantities, and only reuse responds.** That one is not an artifact of a constant.
      evidence_boundary: Synthetic, and the mechanism family is ours. No real data of any kind was used and no claim about any application field is made. This is a self-review, so an attack we did not think of is by construction not in it.

  - id: kryptos-k4
    research_id_prefix: KRYPTOS-K4-
    current_research_id: KRYPTOS-K4-EP-0241
    ja:
      title: Kryptos K4
      home_summary: 未解読の暗号K4について、公開cribでどの方式を否定できるか、見つかったパターンが自由度を払った後にいくら残るかを記録しています。
      question: 97文字の暗号文と24文字のcribで、どの仕組みを否定できるか。見つけるのに使った自由度を数えた後で、生き残るパターンはどれか。
      claim: 解読なし、新しい平文文字0（2026-10-11）。第10〜15ラウンドで、固定した行の一覧、公開機、方陣とmask、印刷されたHill・古典手順、異種2段と配置の転置を検定しました。登録した有限族の決定可能な列に通過はありませんでした。これは述べた設定と誤り許容の範囲の論理的な陰性で、方式一般の否定でも、K4がでたらめより起きにくいという支持でもありません。前提監査の判定一致が不足した箇所、自由な表・長い周期のmask、語内並べ替えとの自由方陣228設定など、両立と未判定を別に残しています。EP-0213の二方陣12類と非全単射Four-squareの3類は両立したまま、EP-0222の16方陣の部分集合外と停止した枝も未検定です。公開パッケージは数・判定器・保存された集計の限定検算で、元の全探索を一括で再実行するものではありません。
        直近ではcrib間のずれと誤り、自由cubeのTrifid、cribごとの2方式、印刷cubeを固定した2段、Hillと方陣の2段でも登録通過0でした。Hill×方陣の1列は26方陣部分集合のnullで、全空間を検定していません。K4への事前接触と事後の診断指標選択がある検定は独立確認として扱いません。
      evidence_boundary: 公開暗号文と24文字のcribに対する探索的な計算。後半の検定の多くはK4に当てる前にlocal commitで固定しましたが、外部の事前登録はなく、一部の事前試行や判定器の訂正を開示しています。公開の内部検算は独立再現ではありません。外部の独立replication・暗号専門家レビューは0。正解は存在しますが公開されていません。
    en:
      title: Kryptos K4
      home_summary: For the unsolved K4 cipher we record which mechanisms the public cribs rule out and
        how much each found pattern is worth once the search's own freedom is paid for.
      question: Which mechanisms can the 97 ciphertext letters and 24 crib letters rule out, and which apparent
        patterns survive once the freedom used to find them is counted?
      claim: No decryption and no new plaintext letter (2026-10-11). Rounds 10–15 tested fixed row lists,
        listed public machines, squares and masks, printed Hill and classical procedures, mixed two-stage
        constructions and listed layout permutations. Decidable columns in the registered finite families
        gave no pass. These are logical negatives within the stated settings and error allowances, not refutations
        of ciphers in general or evidence that K4 is rarer than random. Insufficient coding agreement in
        premise audits, free charts and long-period masks, and 228 compatible free-square/within-word settings
        remain explicitly undecided. Twelve two-square classes in EP-0213 and three nonbijective Four-square
        classes remain compatible; settings outside the sixteen-square subset and the stopped branch in
        EP-0222 remain untested. Public packages verify bounded counts, instruments and saved summaries;
        they do not collectively rerun the original full searches. Recent tests of crib gaps and errors,
        free-cube Trifid, two systems scored per crib, two stages with one printed cube fixed, and Hill
        with square ciphers also gave no registered pass. One Hill/square column uses nulls for a 26-square
        subset rather than the entire space. Tests with preliminary K4 exposure or post-exposure diagnostic
        choices are not independent confirmation.
      evidence_boundary: Exploratory computation on public ciphertext and 24 crib letters. Many later tests
        were fixed by local commits before K4 execution, without external preregistration; preliminary trials
        and instrument corrections are disclosed. Public internal verification is not independent replication.
        External independent replications and cryptographer reviews remain zero. Ground truth exists but
        is withheld.
