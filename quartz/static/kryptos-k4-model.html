<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kryptosの銅板・珪化木・入口のMorse（K0）を公開写真と航空写真から推定した3D模型（Open Research Lab、Kryptos K4 Program）。A 3D model of the Kryptos screen and entrance estimated from public photographs and aerial imagery.">
<title>Kryptos 銅板模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EDF0EC; --surface:#F8FAF7; --ink:#1D2926; --muted:#5E6D68; --line:#CBD4CF;
  --verdigris:#2E7A69; --copper:#B35F33; --crib:#8A5A00; --water:#3F6E86;
  --scene-bg:#D6DED9; --scene-floor:#C4CAC4; --copper-face:#5E8F80; --paper:#F4EEDC;
  --serif:"Old Standard TT", "Times New Roman", Georgia, serif;
  --sans:"IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1513; --surface:#161E1B; --ink:#E1EAE6; --muted:#93A39D; --line:#2A3632;
    --verdigris:#62BBA6; --copper:#DE8C5E; --crib:#E0B24C; --water:#5C95B0;
    --scene-bg:#121A17; --scene-floor:#262F2C; --copper-face:#4A7D6F; --paper:#EFE6CE;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1513; --surface:#161E1B; --ink:#E1EAE6; --muted:#93A39D; --line:#2A3632;
  --verdigris:#62BBA6; --copper:#DE8C5E; --crib:#E0B24C; --water:#5C95B0;
  --scene-bg:#121A17; --scene-floor:#262F2C; --copper-face:#4A7D6F; --paper:#EFE6CE;
}
html,body{height:auto}
body{background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6;
  padding-inline:16px; padding-block:20px 40px; margin:0}
.wrap{max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
header{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 18px}
h1{font-family:var(--serif); font-weight:700; font-size:clamp(26px,4vw,36px); letter-spacing:.06em; margin:0; text-wrap:balance}
h1 small{font-family:var(--sans); font-weight:500; font-size:13px; letter-spacing:.02em; color:var(--muted); margin-left:.6em}
.hright{display:flex; align-items:center; gap:10px}
.draft{font-family:var(--mono); font-size:12px; color:var(--copper); border:1px solid var(--copper); padding:1px 8px; border-radius:3px; white-space:nowrap}
.lede{max-width:70ch; margin:0; color:var(--muted)}
.stage{display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:16px; align-items:start}
@media (max-width:880px){ .stage{grid-template-columns:1fr} }
.view{position:relative; background:var(--scene-bg); border:1px solid var(--line); border-radius:6px; overflow:hidden;
  height:min(70vh,640px); min-height:380px}
.view canvas{display:block; width:100%; height:100%; touch-action:none}
.hint{position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); pointer-events:none}
.sunbadge{position:absolute; right:12px; bottom:10px; font:500 12px/1.3 var(--mono); color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:4px; padding:4px 8px; font-variant-numeric:tabular-nums; pointer-events:none}
.presets{position:absolute; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:6px}
button.pill{font:500 12px/1 var(--sans); color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:7px 11px; cursor:pointer}
button.pill:hover{border-color:var(--verdigris)}
button.pill[aria-pressed="true"]{border-color:var(--verdigris); color:var(--verdigris)}
button.pill:disabled{opacity:.55; cursor:progress}
button:focus-visible, input:focus-visible{outline:2px solid var(--verdigris); outline-offset:2px}
aside{display:flex; flex-direction:column; gap:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px}
.panel h2{font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
.toggle{display:flex; align-items:center; gap:9px; padding:3px 0; cursor:pointer}
.toggle input{accent-color:var(--verdigris); width:16px; height:16px}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-left:auto; flex:none}
.slider{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; font-size:13px}
.slider input[type=range]{width:100%; accent-color:var(--verdigris)}
.slider output{grid-column:2; font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.row-btns{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.readout{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px}
.readout dt{color:var(--muted)}
.readout dd{margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.glyph{font-family:var(--serif); font-size:44px; line-height:1; font-weight:700; color:var(--verdigris); min-height:44px}
.glyph.small{font-size:18px; line-height:1.35; min-height:0}
.empty, .small-note{color:var(--muted); font-size:13px; margin:0}
.small-note{font-size:12px; margin-top:8px}
.params{width:100%; border-collapse:collapse; font-size:13px}
.params td{padding:5px 0; border-bottom:1px solid var(--line); vertical-align:top}
.params td:last-child{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; padding-left:12px}
.params tr:last-child td{border-bottom:0}
.grade{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:4px}
.notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px}
.notes p{margin:0; max-width:65ch}
.notes p + p{margin-top:8px}
.k0list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13px}
.k0list li{display:grid; grid-template-columns:1.6em 1fr; gap:2px 8px}
.k0list .n{font-family:var(--mono); color:var(--muted)}
.k0list .t{font-family:var(--mono); overflow-wrap:anywhere}
.k0list .m{grid-column:2; font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.02em; overflow-wrap:anywhere}
.src{font-size:12px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KRYPTOS <small data-i18n="subtitle"></small></h1>
    <div class="hright">
      <button class="pill" id="b-lang" type="button" aria-label="Language">English</button>
      <span class="draft" data-i18n="badge"></span>
    </div>
  </header>
  <p class="lede" data-i18n="lede"></p>

  <div class="stage">
    <div class="view" id="view">
      <div class="presets" role="group" data-i18n-aria="views">
        <button class="pill" id="v-front" type="button" data-i18n="v_front"></button>
        <button class="pill" id="v-back" type="button" data-i18n="v_back"></button>
        <button class="pill" id="v-inside" type="button" data-i18n="v_inside"></button>
        <button class="pill" id="v-top" type="button" data-i18n="v_top"></button>
        <button class="pill" id="v-k0" type="button" data-i18n="v_k0"></button>
        <button class="pill" id="v-site" type="button" data-i18n="v_site"></button>
      </div>
      <div class="hint" data-i18n="hint"></div>
      <div class="sunbadge" id="sunbadge">—</div>
    </div>

    <aside>
      <div class="panel" aria-live="polite">
        <h2 data-i18n="h_sel"></h2>
        <div id="readout"><p class="empty" data-i18n="sel_empty"></p></div>
      </div>
      <div class="panel">
        <h2 data-i18n="h_light"></h2>
        <div class="slider">
          <label for="s-day" data-i18n="l_date"></label><input type="range" id="s-day" min="1" max="365" step="1" value="307">
          <output id="o-day" for="s-day"></output>
          <label for="s-time" data-i18n="l_time"></label><input type="range" id="s-time" min="5" max="20.5" step="0.25" value="13">
          <output id="o-time" for="s-time"></output>
        </div>
        <div class="row-btns">
          <button class="pill" id="b-dedic" type="button" data-i18n="b_dedic"></button>
          <button class="pill" id="b-summer" type="button" data-i18n="b_summer"></button>
          <button class="pill" id="b-play" type="button" aria-pressed="false" data-i18n="b_play"></button>
        </div>
      </div>
      <div class="panel">
        <h2 data-i18n="h_layers"></h2>
        <label class="toggle"><input type="checkbox" id="t-holes" checked> <span data-i18n="t_holes"></span></label>
        <label class="toggle"><input type="checkbox" id="t-k4" checked> <span data-i18n="t_k4"></span> <span class="sw" style="background:var(--copper)"></span></label>
        <label class="toggle"><input type="checkbox" id="t-crib"> <span data-i18n="t_crib"></span> <span class="sw" style="background:var(--crib)"></span></label>
        <label class="toggle"><input type="checkbox" id="t-seam" checked> <span data-i18n="t_seam"></span></label>
        <label class="toggle"><input type="checkbox" id="t-site" checked> <span data-i18n="t_site"></span></label>
        <label class="toggle"><input type="checkbox" id="t-k0" checked> <span data-i18n="t_k0"></span></label>
      </div>
      <div class="panel">
        <h2 data-i18n="h_export"></h2>
        <div class="row-btns" style="margin-top:0">
          <button class="pill" id="b-gltf" type="button" data-i18n="b_gltf"></button>
          <button class="pill" id="b-csv" type="button" data-i18n="b_csv"></button>
        </div>
        <p class="small-note" id="exportnote" data-i18n="export_note"></p>
      </div>
    </aside>
  </div>

  <p class="lede" id="pubnote" hidden data-i18n="pubnote"></p>
  <section class="notes">
    <div class="panel">
      <h2 data-i18n="h_params"></h2>
      <table class="params" id="params"></table>
    </div>
    <div class="panel">
      <h2 data-i18n="h_k0"></h2>
      <ul class="k0list" id="k0list"></ul>
      <p class="src" style="margin-top:10px" id="k0note"></p>
    </div>
    <div class="panel">
      <h2 data-i18n="h_notes"></h2>
      <p data-i18n-html="n_a"></p>
      <p data-i18n-html="n_c"></p>
      <p data-i18n-html="n_k0"></p>
      <p data-i18n-html="n_open"></p>
      <p data-i18n-html="n_obs"></p>
      <p class="src" data-i18n="n_src"></p>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

      const rose=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(roseCanvas()),roughness:0.8}));
      rose.name='compass_rose'; rose.rotation.x=-Math.PI/2;
      const holder=new THREE.Group(); holder.add(rose);
      holder.position.set(0.3,layers[0].h+layers[1].h+0.011,layers[1].off);
      holder.rotation.y=-S.compass_rose_north_bearing_deg*Math.PI/180-grp.rotation.y;
      grp.add(holder);
      const lode=new THREE.Mesh(new THREE.DodecahedronGeometry(0.3,0),stone(0x2b2b2e,0.7)); lode.name='lodestone';
      lode.position.set(-Ls/2+0.35,topY+0.22,st.lodestone_along_m); lode.castShadow=true; grp.add(lode);
    }
    k0.add(grp);
    if(st.kind==='morse'){ EX=cx; EY=cy; }
  }
  groundLabel('NHB',WB[0]+ux*4,WB[1]+uy*4,3,'#2E7A69',k0);
  groundLabel('K0',WA[0]+ux*55,WA[1]+uy*55+8,2.2,'#B35F33',k0);
}

// ---------- sun ----------
function sunPosition(dayOfYear,localHour){
  const lat=S.latitude_deg*Math.PI/180, lon=S.longitude_deg;
  const dst=(dayOfYear>=70 && dayOfYear<=307);           // US daylight time, approx. 2nd Sun Mar - 1st Sun Nov
  const tz=dst?-4:-5;
  const gam=2*Math.PI/365*(dayOfYear-1+(localHour-12)/24);
  const eqt=229.18*(0.000075+0.001868*Math.cos(gam)-0.032077*Math.sin(gam)-0.014615*Math.cos(2*gam)-0.040849*Math.sin(2*gam));
  const decl=0.006918-0.399912*Math.cos(gam)+0.070257*Math.sin(gam)-0.006758*Math.cos(2*gam)+0.000907*Math.sin(2*gam)-0.002697*Math.cos(3*gam)+0.00148*Math.sin(3*gam);
  const tst=localHour*60+eqt+4*lon-60*tz;
  const ha=(tst/4-180)*Math.PI/180;
  const cz=Math.sin(lat)*Math.sin(decl)+Math.cos(lat)*Math.cos(decl)*Math.cos(ha);
  const el=Math.asin(Math.max(-1,Math.min(1,cz)));
  const az=(Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(lat)-Math.tan(decl)*Math.cos(lat))+Math.PI)%(2*Math.PI);
  return {az,el,dst};
}
const MONTHS=[31,28,31,30,31,30,31,31,30,31,30,31];
function monthDay(d){ let m=0; while(d>MONTHS[m]){d-=MONTHS[m];m++;} return [m+1,d]; }
const sDay=document.getElementById('s-day'), sTime=document.getElementById('s-time');
function updateSun(){
  const d=+sDay.value, h=+sTime.value, {az,el,dst}=sunPosition(d,h);
  document.getElementById('o-day').textContent=t('day',...monthDay(d));
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  document.getElementById('o-time').textContent=`${hh}:${String(mm).padStart(2,'0')}${t('tz',dst)}`;
  const dir=new THREE.Vector3(Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el));
  SUNDIR={x:Math.sin(az)*Math.cos(el), y:Math.cos(az)*Math.cos(el), z:Math.sin(el), el};
  sun.position.copy(sun.target.position).addScaledVector(dir,30);
  const up=Math.max(0,Math.sin(el));
  sun.intensity=el>0?0.35+1.1*Math.min(1,up*2.2):0;
  hemi.intensity=el>0?0.45+0.25*up:0.18;
  const azd=az*180/Math.PI, eld=el*180/Math.PI;
  document.getElementById('sunbadge').textContent=el>0?t('sun',azd.toFixed(0),compass16(azd),eld.toFixed(0)):t('sun_below');
}
sDay.addEventListener('input',updateSun); sTime.addEventListener('input',updateSun);
document.getElementById('b-dedic').onclick=()=>{sDay.value=307; sTime.value=12; updateSun();};
document.getElementById('b-summer').onclick=()=>{sDay.value=172; sTime.value=13; updateSun();};

// ---------- physical features of a carved cell ----------
function cellFeatures(half,row,col){
  const rows=half==="cipher"?CIPHER:TABLEAU, nn=rows[row].length;
  const ncols=half==="cipher"?P.cipher_arc_cols:P.tableau_arc_cols;
  const s=letterS(half,nn,col), p=arcPoint(half,s);
  const z=P.top_row_z_m-row*P.row_pitch_m;
  const sunCos=SUNDIR.z>0 ? p.nx*SUNDIR.x+p.ny*SUNDIR.y : 0;   // sun on the front face (>0) or the back (<0)
  return {x:p.x,y:p.y,z,facing:bearing(p.nx,p.ny),fromSeam:ncols*P.col_pitch_m-s,
          trunk:Math.hypot(p.x-TRUNK[0],p.y-TRUNK[1]), sunCos};   // horizontal distance to the trunk axis
}

// ---------- picking ----------
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
const readout=document.getElementById('readout');
let lastPick=null;
function show(glyph,rows,small){
  readout.innerHTML=`<div class="glyph${small?' small':''}">${glyph}</div><dl class="readout">${rows.map(([a,v])=>`<dt>${a}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function renderPick(){
  if(!lastPick) return;
  if(lastPick.k0!==undefined){
    const u=lastPick.k0, U=K0[u], lay=K0L[u];
    show(U.pieces.join(' | '),[
      ['K0',t('k0unit',u+1)],
      [t('k0rows'),lay.rows.map(r=>`${r.length_u} u`).join(' / ')],
      [t('k0len'),`${(lay.length_u*S.morse.unit_m).toFixed(2)} m`],
      [t('k0marks'),`${U.marks}`],
      ['Morse',U.morse.join(' ‖ ')],
      ['',t('k0note_pick')]],true);
    return;
  }
  const {half,row,col}=lastPick, rows=half==="cipher"?CIPHER:TABLEAU, nn=rows[row].length;
  const f=cellFeatures(half,row,col), k=half==="cipher"?k4Index(row,col):-1;
  const chShown=rows[row][col]==='·'?'—':rows[row][col];
  const sunTxt=SUNDIR.z<=0?t('dark'):(f.sunCos>0?t('lit',f.sunCos.toFixed(2)):t('backlit',(-f.sunCos).toFixed(2)));
  show(chShown,[
    [t('half'), t(half)],
    [t('plate'), row<14?t('upper'):t('lower')],
    [t('rowcol'), `${row} · ${col}`+(LANG==='en'?` (${t('rowlen',nn)})`:`（${t('rowlen',nn)}）`)+(rows[row][col]==='·'?t('withheld'):'')],
    [t('k4pos'), k>=0?`${k}${CRIB.has(k)?t('crib'):''}`:'—'],
    [t('planxy'), `${f.x.toFixed(2)}, ${f.y.toFixed(2)} m`],
    [t('height'), `${f.z.toFixed(2)} m`],
    [t('facing'), `${f.facing.toFixed(1)}° ${compass16(f.facing)}`],
    [t('fromseam'), `${f.fromSeam.toFixed(2)} m`],
    [t('trunk'), `${f.trunk.toFixed(2)} m`],
    [t('sunface'), sunTxt],
  ]);
}
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const targets=[halves.cipher.mesh,halves.tableau.mesh];
  if(k0.visible) targets.push(...k0Strips);
  const hit=ray.intersectObjects(targets)[0];
  if(!hit||!hit.uv) return;
  if(hit.object.userData.k0unit!==undefined){ lastPick={k0:hit.object.userData.k0unit}; renderPick(); return; }
  const half=hit.object.userData.half, ncols=half==="cipher"?P.cipher_arc_cols:P.tableau_arc_cols;
  const rows=half==="cipher"?CIPHER:TABLEAU;
  const zTop=P.top_row_z_m+P.row_pitch_m/2, z=hit.uv.y*TOP;
  const row=Math.floor((zTop-z)/P.row_pitch_m);
  if(row<0||row>=ROWS) return;
  const nn=rows[row].length, col=Math.floor((hit.uv.x*ncols-0.5)/(ncols-1)*nn);
  if(col<0||col>=nn||rows[row][col]===' ') return;
  lastPick={half,row,col}; renderPick();
}
renderer.domElement.addEventListener('pointermove',pick);
renderer.domElement.addEventListener('pointerdown',pick);

const viewBtns=['v-front','v-back','v-inside','v-top','v-k0','v-site'].map(id=>document.getElementById(id));
function setView(which){
  const t_=new THREE.Vector3(0,1.6,0);
  if(which==='front') camera.position.set(0.8,2.2,9.5);
  if(which==='back') camera.position.set(-0.8,2.2,-9.5);

  if(which==='top'){ camera.position.set(0,13,0.01); t_.set(0,0,0); }
  if(which==='k0'){ camera.position.copy(W(EX-6,EY-22,11)); t_.copy(W(EX+4,EY-5,0.4)); k0.visible=true; document.getElementById('t-k0').checked=true; }

  viewBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.id==='v-'+which)));
}
viewBtns.forEach(b=>b.onclick=()=>setView(b.id.slice(2)));
for(const [id,key] of [['t-holes','holes'],['t-k4','k4'],['t-crib','crib'],['t-seam','seam']]){

}

// ---------- export ----------
// Inside a claude.ai viewer, files go through the platform's downloads capability (the viewer confirms each
// save; .glb is not on its extension list, so the model travels in a .zip).  On a plain web page, a normal
// browser download.
const DL=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
const note=document.getElementById('exportnote');
const CRC=(()=>{const tb=new Uint32Array(256); for(let n=0;n<256;n++){let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; tb[n]=c>>>0;} return tb;})();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipOne(name,u8){   // a stored (uncompressed) single-file zip
  const nm=new TextEncoder().encode(name), crc=crc32(u8), n=u8.length;
  const put=(dv,f)=>f.forEach(([o,v,w])=>w===4?dv.setUint32(o,v,true):dv.setUint16(o,v,true));
  const loc=new DataView(new ArrayBuffer(30)); put(loc,[[0,0x04034b50,4],[4,20,2],[14,crc,4],[18,n,4],[22,n,4],[26,nm.length,2]]);
  const cen=new DataView(new ArrayBuffer(46)); put(cen,[[0,0x02014b50,4],[4,20,2],[6,20,2],[16,crc,4],[20,n,4],[24,n,4],[28,nm.length,2],[42,0,4]]);
  const end=new DataView(new ArrayBuffer(22)); put(end,[[0,0x06054b50,4],[8,1,2],[10,1,2],[12,46+nm.length,4],[16,30+nm.length+n,4]]);
  return new Blob([loc,nm,u8,cen,nm,end],{type:'application/zip'});
}
function anchorSave(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
}
async function offer(name,blob){
  const dl=await DL;
  if(!dl){ anchorSave(blob,name); return; }
  try{ await dl.save({filename:name,data:blob}); }
  catch(e){ if(e&&e.code!=='declined') note.textContent=t('export_fail')+(e.code||e.message); }
}
document.getElementById('b-gltf').onclick=(ev)=>{
  const b=ev.currentTarget; b.disabled=true; const old=b.textContent; b.textContent=t('exporting');
  const done=()=>{ b.disabled=false; b.textContent=old; };
  try{
    new THREE.GLTFExporter().parse(scene,async res=>{
      const name=`kryptos-model-${VER}.glb`, dl=await DL;
      await offer(dl?name+'.zip':name, dl?zipOne(name,new Uint8Array(res)):new Blob([res],{type:'model/gltf-binary'}));
      done();
    },{binary:true,onlyVisible:true,maxTextureSize:4096});
  }catch(e){ done(); note.textContent=t('export_fail')+e.message; }
};
document.getElementById('b-csv').onclick=()=>{
  const d=+sDay.value, h=+sTime.value;
  const lines=[`# Kryptos K4 cells, physical features from the draft model ${VER} (grade C); plan x east, y north, metres; sun for day ${d}, local hour ${h}`,
    'k4_index,letter,row,col,x_m,y_m,z_m,facing_deg,arc_from_seam_m,trunk_axis_m,sun_cos'];
  for(let k=0;k<97;k++){
    const row=k<4?24:25+Math.floor((k-4)/31), col=k<4?27+k:(k-4)%31;
    const f=cellFeatures('cipher',row,col);
    lines.push([k,CIPHER[row][col],row,col,f.x.toFixed(4),f.y.toFixed(4),f.z.toFixed(4),f.facing.toFixed(2),f.fromSeam.toFixed(4),f.trunk.toFixed(4),f.sunCos.toFixed(4)].join(','));
  }
  offer(`kryptos-k4-features-${VER}.csv`,new Blob([lines.join('\n')+'\n'],{type:'text/csv'}));
};

// ---------- side panels and language ----------
const g_=v=>`<span class="grade">${v}</span>`;
function renderPanels(){
  document.getElementById('params').innerHTML=[
    [t('p_r'), `${P.r_cipher_m} / ${P.r_tableau_m} m${g_('C')}`],
    [t('p_pitch'), `${P.col_pitch_m} / ${P.row_pitch_m} m${g_('C')}`],
    [t('p_angle'), `${Math.round(P.cipher_arc_cols*P.col_pitch_m/P.r_cipher_m*180/Math.PI)}° / ${Math.round(P.tableau_arc_cols*P.col_pitch_m/P.r_tableau_m*180/Math.PI)}°${g_('C')}`],
    [t('p_ends'), `${DATA.end_to_end_m.toFixed(2)} m${t('p_pub')}${g_('B')}`],

  document.getElementById('k0list').innerHTML=K0.map((u,i)=>`<li><span class="n">${i+1}</span><span class="t">${u.pieces.join(' <span style="color:var(--muted)">|</span> ')}</span><span class="m">${t('k0marks_li',u.marks)} · ${K0L[i].rows.map(r=>r.length_u).join(' / ')} u</span></li>`).join('');
  document.getElementById('k0note').textContent=t('k0note',DATA.k0_total_marks);
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.title=LANG==='en'?'Kryptos copper model':'Kryptos 銅板模型';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });

function applyTheme(){
  scene.background=colorOf('--scene-bg','#D6DED9');

}
function resize(){ const w=view.clientWidth,h=view.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);

(function loop(t_){
  if(playing && !reduce && t_-lastT>60){ let h=+sTime.value+0.05; if(h>20.5) h=5; sTime.value=h; updateSun(); renderPick(); lastT=t_; }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
})(0);
